services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      landing:
        condition: service_started
      client-web:
        condition: service_started
      astrologer-web:
        condition: service_started
      admin-web:
        condition: service_started
      public-api:
        condition: service_healthy
      astrologer-api:
        condition: service_healthy
      admin-api:
        condition: service_healthy

  landing:
    image: ${IMAGE_NAMESPACE}/elevenhouse-landing:${IMAGE_TAG}
    restart: unless-stopped

  client-web:
    image: ${IMAGE_NAMESPACE}/elevenhouse-client-web:${IMAGE_TAG}
    restart: unless-stopped

  astrologer-web:
    image: ${IMAGE_NAMESPACE}/elevenhouse-astrologer-web:${IMAGE_TAG}
    restart: unless-stopped

  admin-web:
    image: ${IMAGE_NAMESPACE}/elevenhouse-admin-web:${IMAGE_TAG}
    restart: unless-stopped

  public-api:
    image: ${IMAGE_NAMESPACE}/elevenhouse-public-api:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ../env/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3001/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  astrologer-api:
    image: ${IMAGE_NAMESPACE}/elevenhouse-astrologer-api:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ../env/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3002/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default
      - chart-provider

  admin-api:
    image: ${IMAGE_NAMESPACE}/elevenhouse-admin-api:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ../env/.env.production
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3003/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  workers:
    image: ${IMAGE_NAMESPACE}/elevenhouse-workers:${IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - ../env/.env.production
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3010/ready'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  payment-worker:
    image: ${IMAGE_NAMESPACE}/elevenhouse-payment-worker:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ../env/.env.production
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3011/ready'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  chart-worker:
    image: ${IMAGE_NAMESPACE}/elevenhouse-chart-worker:${IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 135s
    env_file:
      - path: ../env/.env.chart-worker.production
        format: raw
    environment:
      NODE_ENV: production
      CHART_WORKER_HEALTH_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chart-engine:
        condition: service_healthy
    networks:
      - default
      - chart-provider
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3012/ready'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  chart-engine:
    image: ${IMAGE_NAMESPACE}/elevenhouse-chart-engine:${IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 120s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ../env/.env.chart-engine.production
        format: raw
    environment:
      NODE_ENV: production
      CHART_ENGINE_HOST: 0.0.0.0
      CHART_ENGINE_PORT: "8012"
      # Keep one runtime semaphore for the configured provider concurrency.
      CHART_ENGINE_WORKERS: "1"
      CHART_ENGINE_EPHEMERIS_DATA_DIR: /run/elevenhouse/ephemeris
      CHART_ENGINE_READINESS_TIMEOUT_SECONDS: "5"
    volumes:
      - ../ephemeris:/run/elevenhouse/ephemeris:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    expose:
      - "8012"
    networks:
      - chart-provider
    healthcheck:
      # chart-engine also exposes /live; production gates on /ready.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/ready', timeout=4).read()"
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  notification-worker:
    image: ${IMAGE_NAMESPACE}/elevenhouse-notification-worker:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ../env/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3013/ready'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db-migrator:
    image: ${IMAGE_NAMESPACE}/elevenhouse-db-migrator:${IMAGE_TAG}
    profiles:
      - maintenance
    env_file:
      - ../env/.env.production
    depends_on:
      postgres:
        condition: service_healthy

  db-baseline-preflight:
    image: ${IMAGE_NAMESPACE}/elevenhouse-db-migrator:${IMAGE_TAG}
    command: ["pnpm", "--filter", "@elevenhouse/db", "db:preflight-production-baseline"]
    profiles:
      - maintenance
    env_file:
      - ../env/.env.production
    depends_on:
      postgres:
        condition: service_healthy

  db-seeder:
    image: ${IMAGE_NAMESPACE}/elevenhouse-db-migrator:${IMAGE_TAG}
    command: ["pnpm", "db:seed"]
    profiles:
      - maintenance
    env_file:
      - ../env/.env.production
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    env_file:
      - ../env/.env.production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ../env/.env.production
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    env_file:
      - ../env/.env.production
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ "$${#MINIO_APP_USER}" -lt 3 ] || [ "$${#MINIO_APP_USER}" -gt 20 ]; then
          echo "MINIO_APP_USER length must be between 3 and 20 characters." >&2
          exit 1
        fi
        if [ "$${#MINIO_APP_PASSWORD}" -lt 8 ] || [ "$${#MINIO_APP_PASSWORD}" -gt 40 ]; then
          echo "MINIO_APP_PASSWORD length must be between 8 and 40 characters." >&2
          exit 1
        fi
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done
        mc mb --ignore-existing "local/$${MINIO_MEDIA_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_PRIVATE_BUCKET}"
        cat >/tmp/elevenhouse-media-app-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:ListBucket"],
              "Resource": [
                "arn:aws:s3:::$${MINIO_MEDIA_BUCKET}",
                "arn:aws:s3:::$${MINIO_PRIVATE_BUCKET}"
              ]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:PutObject", "s3:GetObject", "s3:DeleteObject"],
              "Resource": [
                "arn:aws:s3:::$${MINIO_MEDIA_BUCKET}/*",
                "arn:aws:s3:::$${MINIO_PRIVATE_BUCKET}/*"
              ]
            }
          ]
        }
        EOF
        cat >/tmp/elevenhouse-media-public-read-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {"AWS": ["*"]},
              "Action": ["s3:GetObject"],
              "Resource": [
                "arn:aws:s3:::$${MINIO_MEDIA_BUCKET}/*/product_cover/*",
                "arn:aws:s3:::$${MINIO_MEDIA_BUCKET}/*/profile_avatar/*",
                "arn:aws:s3:::$${MINIO_MEDIA_BUCKET}/*/profile_cover/*"
              ]
            }
          ]
        }
        EOF
        mc admin user svcacct remove local "$${MINIO_APP_USER}" >/dev/null 2>&1 || true
        mc admin user svcacct add local "$${MINIO_ROOT_USER}" \
          --access-key "$${MINIO_APP_USER}" \
          --secret-key "$${MINIO_APP_PASSWORD}" \
          --policy /tmp/elevenhouse-media-app-policy.json \
          >/dev/null
        mc anonymous set-json /tmp/elevenhouse-media-public-read-policy.json "local/$${MINIO_MEDIA_BUCKET}"
        mc anonymous set none "local/$${MINIO_PRIVATE_BUCKET}"

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  minio-data:

networks:
  chart-provider:
    internal: true

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: elevenhouse
      POSTGRES_USER: elevenhouse
      POSTGRES_PASSWORD: elevenhouse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevenhouse -d elevenhouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: elevenhouse
      MINIO_ROOT_PASSWORD: elevenhouse-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until mc alias set local http://minio:9000 elevenhouse elevenhouse-secret; do sleep 2; done &&
      mc mb --ignore-existing local/elevenhouse-local-media &&
      mc mb --ignore-existing local/elevenhouse-local-private &&
      mc anonymous set download local/elevenhouse-local-media &&
      mc anonymous set none local/elevenhouse-local-private"

volumes:
  postgres-data:
  minio-data:

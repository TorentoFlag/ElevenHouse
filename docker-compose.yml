services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: elevenhouse
      POSTGRES_USER: elevenhouse
      POSTGRES_PASSWORD: elevenhouse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevenhouse -d elevenhouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

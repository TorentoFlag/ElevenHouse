[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elevenhouse-chart-engine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "kerykeion>=5.12,<5.13"
]

[project.optional-dependencies]
test = [
  "pytest>=8.2,<9.0",
  "httpx2>=2.7,<3.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning:kerykeion.backword"
]

[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "elevenhouse-chart-engine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]==0.51.0",
  "pydantic==2.13.4",
  "kerykeion==5.12.9",
  "pyswisseph==2.10.3.2",
  "tzdata==2026.3"
]

[project.optional-dependencies]
test = [
  "pytest>=8.2,<9.0",
  "httpx2>=2.7,<3.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning:kerykeion.backword"
]

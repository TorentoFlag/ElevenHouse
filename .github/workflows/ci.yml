name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - elevenhouse-stage
    steps:
      - name: Validate runner identity
        run: |
          if [ "$(id -u)" = "0" ]; then
            echo "SELF_HOSTED_RUNNER_MUST_NOT_RUN_AS_ROOT" >&2
            exit 1
          fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            echo "SELF_HOSTED_RUNNER_MUST_NOT_HAVE_PASSWORDLESS_SUDO" >&2
            exit 1
          fi
          case "${GITHUB_WORKSPACE:-}" in
            /opt/* | /root/* | /)
              echo "SELF_HOSTED_RUNNER_WORKSPACE_FORBIDDEN path=${GITHUB_WORKSPACE:-}" >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

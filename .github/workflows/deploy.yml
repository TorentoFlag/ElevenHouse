name: Deploy Production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      prelaunch_reset:
        description: "Recreate the disposable production PostgreSQL database before applying this release baseline"
        required: true
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/torentoflag
  IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  plan-images:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - elevenhouse-stage
    environment:
      name: production
      deployment: false
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    permissions:
      contents: read
    outputs:
      deploy_required: ${{ steps.plan.outputs.deploy_required }}
      has_build: ${{ steps.plan.outputs.has_build }}
      has_promote: ${{ steps.plan.outputs.has_promote }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      promote_matrix: ${{ steps.plan.outputs.promote_matrix }}
      current_image_tag: ${{ steps.plan.outputs.current_image_tag }}
    steps:
      - name: Validate runner identity
        run: |
          if [ "$(id -u)" = "0" ]; then
            echo "SELF_HOSTED_RUNNER_MUST_NOT_RUN_AS_ROOT" >&2
            exit 1
          fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            echo "SELF_HOSTED_RUNNER_MUST_NOT_HAVE_PASSWORDLESS_SUDO" >&2
            exit 1
          fi
          case "${GITHUB_WORKSPACE:-}" in
            /opt/* | /root/* | /)
              echo "SELF_HOSTED_RUNNER_WORKSPACE_FORBIDDEN path=${GITHUB_WORKSPACE:-}" >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_TAG }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare SSH
        env:
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "${PRODUCTION_SSH_KEY}" > ~/.ssh/elevenhouse
          chmod 0600 ~/.ssh/elevenhouse
          printf '%s\n' "${PRODUCTION_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Read current production image tag
        id: current
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i ~/.ssh/elevenhouse)
          current_image_tag="$(
            ssh "${SSH_OPTS[@]}" "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
              "awk -F= '\$1 == \"IMAGE_TAG\" { print \$2 }' /opt/elevenhouse/env/.env.deploy 2>/dev/null || true"
          )"
          if [ -n "${current_image_tag}" ] && ! [[ "${current_image_tag}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "CURRENT_IMAGE_TAG_INVALID value=${current_image_tag}" >&2
            exit 1
          fi
          printf 'current_image_tag=%s\n' "${current_image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Plan production images
        id: plan
        env:
          BASE_REF: ${{ steps.current.outputs.current_image_tag }}
          CURRENT_IMAGE_TAG: ${{ steps.current.outputs.current_image_tag }}
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          bash deployment/scripts/validate-self-hosted-runner.sh
          if [ -z "${BASE_REF}" ]; then
            BASE_REF="$(git rev-parse "${IMAGE_TAG}^")"
          fi
          node deployment/scripts/plan-production-images.mjs "${BASE_REF}" "${IMAGE_TAG}"

  build-and-push:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - elevenhouse-stage
    if: ${{ needs.plan-images.outputs.deploy_required == 'true' && needs.plan-images.outputs.has_build == 'true' }}
    permissions:
      contents: read
      packages: write
    needs:
      - plan-images
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.plan-images.outputs.build_matrix) }}
    steps:
      - name: Validate runner identity
        run: |
          if [ "$(id -u)" = "0" ]; then
            echo "SELF_HOSTED_RUNNER_MUST_NOT_RUN_AS_ROOT" >&2
            exit 1
          fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            echo "SELF_HOSTED_RUNNER_MUST_NOT_HAVE_PASSWORDLESS_SUDO" >&2
            exit 1
          fi
          case "${GITHUB_WORKSPACE:-}" in
            /opt/* | /root/* | /)
              echo "SELF_HOSTED_RUNNER_WORKSPACE_FORBIDDEN path=${GITHUB_WORKSPACE:-}" >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Validate rootless Docker
        run: bash deployment/scripts/validate-self-hosted-runner.sh --require-rootless-docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push changed image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest
          build-args: |
            APP_FILTER=${{ matrix.app_filter }}
            APP_DIR=${{ matrix.app_dir }}
            ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  promote-unchanged:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - elevenhouse-stage
    if: ${{ needs.plan-images.outputs.deploy_required == 'true' && needs.plan-images.outputs.has_promote == 'true' }}
    permissions:
      contents: read
      packages: write
    needs:
      - plan-images
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.plan-images.outputs.promote_matrix) }}
    steps:
      - name: Validate runner identity
        run: |
          if [ "$(id -u)" = "0" ]; then
            echo "SELF_HOSTED_RUNNER_MUST_NOT_RUN_AS_ROOT" >&2
            exit 1
          fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            echo "SELF_HOSTED_RUNNER_MUST_NOT_HAVE_PASSWORDLESS_SUDO" >&2
            exit 1
          fi
          case "${GITHUB_WORKSPACE:-}" in
            /opt/* | /root/* | /)
              echo "SELF_HOSTED_RUNNER_WORKSPACE_FORBIDDEN path=${GITHUB_WORKSPACE:-}" >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Validate rootless Docker
        run: bash deployment/scripts/validate-self-hosted-runner.sh --require-rootless-docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote unchanged image tag
        env:
          CURRENT_IMAGE_TAG: ${{ needs.plan-images.outputs.current_image_tag }}
        run: |
          if [ -z "${CURRENT_IMAGE_TAG}" ]; then
            echo "CURRENT_IMAGE_TAG_REQUIRED_FOR_IMAGE_PROMOTION" >&2
            exit 1
          fi
          if [ "${CURRENT_IMAGE_TAG}" = "${IMAGE_TAG}" ]; then
            echo "Image ${{ matrix.image }} already has target tag ${IMAGE_TAG}."
            exit 0
          fi
          docker buildx imagetools create \
            -t "${IMAGE_NAMESPACE}/${{ matrix.image }}:${IMAGE_TAG}" \
            -t "${IMAGE_NAMESPACE}/${{ matrix.image }}:latest" \
            "${IMAGE_NAMESPACE}/${{ matrix.image }}:${CURRENT_IMAGE_TAG}"

  deploy:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - elevenhouse-stage
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
    needs:
      - plan-images
      - build-and-push
      - promote-unchanged
    if: >-
      ${{
        always() &&
        needs.plan-images.result == 'success' &&
        needs.plan-images.outputs.deploy_required == 'true' &&
        (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
        (needs.promote-unchanged.result == 'success' || needs.promote-unchanged.result == 'skipped')
      }}
    steps:
      - name: Validate runner identity
        run: |
          if [ "$(id -u)" = "0" ]; then
            echo "SELF_HOSTED_RUNNER_MUST_NOT_RUN_AS_ROOT" >&2
            exit 1
          fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            echo "SELF_HOSTED_RUNNER_MUST_NOT_HAVE_PASSWORDLESS_SUDO" >&2
            exit 1
          fi
          case "${GITHUB_WORKSPACE:-}" in
            /opt/* | /root/* | /)
              echo "SELF_HOSTED_RUNNER_WORKSPACE_FORBIDDEN path=${GITHUB_WORKSPACE:-}" >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Prepare SSH
        env:
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "${PRODUCTION_SSH_KEY}" > ~/.ssh/elevenhouse
          chmod 0600 ~/.ssh/elevenhouse
          printf '%s\n' "${PRODUCTION_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Preflight production providers
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i ~/.ssh/elevenhouse)
          ssh "${SSH_OPTS[@]}" "${PRODUCTION_USER}@${PRODUCTION_HOST}" 'bash -s' < deployment/server/preflight-production-providers.sh

      - name: Preflight licensed chart ephemeris
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i ~/.ssh/elevenhouse)
          ssh "${SSH_OPTS[@]}" "${PRODUCTION_USER}@${PRODUCTION_HOST}" 'bash -s' < deployment/server/preflight-chart-ephemeris.sh

      - name: Upload deployment files
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i ~/.ssh/elevenhouse)
          ssh "${SSH_OPTS[@]}" "${PRODUCTION_USER}@${PRODUCTION_HOST}" 'install -d -m 0755 /opt/elevenhouse/compose /opt/elevenhouse/caddy && install -d -m 0700 /opt/elevenhouse/env /opt/elevenhouse/backups/postgres'
          scp "${SSH_OPTS[@]}" deployment/compose/compose.production.yml "${PRODUCTION_USER}@${PRODUCTION_HOST}:/opt/elevenhouse/compose/compose.production.yml.next"
          scp "${SSH_OPTS[@]}" deployment/caddy/Caddyfile "${PRODUCTION_USER}@${PRODUCTION_HOST}:/opt/elevenhouse/caddy/Caddyfile"
          scp "${SSH_OPTS[@]}" deployment/server/backup-postgres.sh "${PRODUCTION_USER}@${PRODUCTION_HOST}:/opt/elevenhouse/backup-postgres.sh"
          scp "${SSH_OPTS[@]}" deployment/server/restore-postgres.sh "${PRODUCTION_USER}@${PRODUCTION_HOST}:/opt/elevenhouse/restore-postgres.sh"
          scp "${SSH_OPTS[@]}" deployment/server/cleanup-docker-retention.sh "${PRODUCTION_USER}@${PRODUCTION_HOST}:/opt/elevenhouse/cleanup-docker-retention.sh"
          scp "${SSH_OPTS[@]}" deployment/server/materialize-chart-service-envs.sh "${PRODUCTION_USER}@${PRODUCTION_HOST}:/opt/elevenhouse/materialize-chart-service-envs.sh"

      - name: Deploy over SSH
        env:
          PRODUCTION_GHCR_READ_TOKEN: ${{ secrets.PRODUCTION_GHCR_READ_TOKEN }}
          PRODUCTION_GHCR_USERNAME: ${{ secrets.PRODUCTION_GHCR_USERNAME }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i ~/.ssh/elevenhouse)
          ssh "${SSH_OPTS[@]}" "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            IMAGE_NAMESPACE="${IMAGE_NAMESPACE}" \
            IMAGE_TAG="${IMAGE_TAG}" \
            GHCR_USERNAME="${PRODUCTION_GHCR_USERNAME}" \
            GHCR_TOKEN="${PRODUCTION_GHCR_READ_TOKEN}" \
            PRELAUNCH_RESET="${{ github.event_name == 'workflow_dispatch' && inputs.prelaunch_reset || 'false' }}" \
            PRELAUNCH_RESET_RELEASE="${IMAGE_TAG}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          set -E
          cd /opt/elevenhouse
          database_writers_quiesced=false
          deploy_phase=preflight
          trap 'if [[ "${database_writers_quiesced}" == true ]]; then printf "PRODUCTION_DEPLOY_FAILED phase=%s automatic_old_release_restart=disabled\n" "${deploy_phase}" >&2; fi' ERR
          chmod +x backup-postgres.sh restore-postgres.sh cleanup-docker-retention.sh materialize-chart-service-envs.sh
          test -f env/.env.production
          test "$(stat -c '%a' env/.env.production)" = "600"
          install -d -m 0700 env backups/postgres
          ./materialize-chart-service-envs.sh
          test "$(stat -c '%a' env/.env.chart-engine.production)" = "600"
          test "$(stat -c '%a' env/.env.chart-worker.production)" = "600"
          umask 077
          cat > env/.env.deploy.next <<EOF
          IMAGE_NAMESPACE=${IMAGE_NAMESPACE}
          IMAGE_TAG=${IMAGE_TAG}
          COMPOSE_PROJECT_NAME=elevenhouse
          EOF
          compose_version="$(docker compose version --short)"
          compose_version="${compose_version#v}"
          if [[ ! "${compose_version}" =~ ^([0-9]+)\.([0-9]+)(\.|$) ]]; then
            printf '%s\n' 'COMPOSE_VERSION_UNSUPPORTED' >&2
            exit 1
          fi
          compose_major="${BASH_REMATCH[1]}"
          compose_minor="${BASH_REMATCH[2]}"
          if (( compose_major < 2 || (compose_major == 2 && compose_minor < 30) )); then
            printf '%s\n' 'COMPOSE_VERSION_UNSUPPORTED' >&2
            exit 1
          fi
          docker compose --env-file env/.env.deploy.next -f compose/compose.production.yml.next config --quiet
          ./cleanup-docker-retention.sh bootstrap-successful-release
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
          docker compose --env-file env/.env.deploy.next -f compose/compose.production.yml.next pull
          docker compose --env-file env/.env.deploy.next -f compose/compose.production.yml.next run --rm -T --no-deps workers \
            node apps/workers/dist/validate-startup-config.js </dev/null
          docker compose --env-file env/.env.deploy.next -f compose/compose.production.yml.next run --rm -T --no-deps chart-worker \
            node apps/chart-worker/dist/validate-startup-config.js </dev/null
          docker compose --env-file env/.env.deploy.next -f compose/compose.production.yml.next run --rm -T --no-deps admin-api \
            node -e "require('./apps/admin-api/dist/config/runtime-config.js').createAdminApiRuntimeConfig(process.env)" </dev/null
          docker compose --env-file env/.env.deploy.next -f compose/compose.production.yml.next up -d --no-recreate --wait --wait-timeout 120 postgres
          if [[ "${PRELAUNCH_RESET}" != "true" ]]; then
            docker compose --env-file env/.env.deploy.next -f compose/compose.production.yml.next run --rm -T db-baseline-preflight </dev/null
          fi
          mv -- compose/compose.production.yml.next compose/compose.production.yml
          mv -- env/.env.deploy.next env/.env.deploy
          docker compose --env-file env/.env.deploy -f compose/compose.production.yml up -d --no-recreate --wait --wait-timeout 120 postgres
          DATABASE_WRITER_SERVICES=(
            public-api
            astrologer-api
            admin-api
            workers
            payment-worker
            chart-worker
            notification-worker
          )
          deploy_phase=quiesce_database_writers
          docker compose --env-file env/.env.deploy -f compose/compose.production.yml stop --timeout 150 "${DATABASE_WRITER_SERVICES[@]}"
          running_database_writers="$(docker compose --env-file env/.env.deploy -f compose/compose.production.yml ps --status running --services "${DATABASE_WRITER_SERVICES[@]}")"
          if [[ -n "${running_database_writers}" ]]; then
            printf 'PRODUCTION_DATABASE_WRITERS_STILL_RUNNING services=%s\n' "${running_database_writers}" >&2
            exit 1
          fi
          database_writers_quiesced=true
          active_database_sessions="$(
            docker compose --env-file env/.env.deploy -f compose/compose.production.yml exec -T postgres \
              sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' <<'SQL'
          SELECT count(*)
            FROM pg_stat_activity
           WHERE datname = current_database()
             AND backend_type = 'client backend'
             AND pid <> pg_backend_pid();
          SQL
          )"
          if [[ "${active_database_sessions}" != "0" ]]; then
            printf 'PRODUCTION_DATABASE_NOT_QUIESCED active_client_sessions=%s\n' "${active_database_sessions}" >&2
            exit 1
          fi
          deploy_phase=backup
          ./backup-postgres.sh
          if [[ "${PRELAUNCH_RESET}" == "true" ]]; then
            deploy_phase=prelaunch_reset
            docker compose --env-file env/.env.deploy -f compose/compose.production.yml run --rm -T \
              -e PRELAUNCH_RESET_EXPECTED_DATABASE_HOST=postgres \
              -e PRELAUNCH_RESET_EXPECTED_DATABASE_NAME=elevenhouse \
              -e PRELAUNCH_RESET_RELEASE="${PRELAUNCH_RESET_RELEASE}" \
              db-migrator pnpm --filter @elevenhouse/db db:reset-production-prelaunch -- \
              --confirm-prelaunch-reset="${PRELAUNCH_RESET_RELEASE}:postgres:5432/elevenhouse" </dev/null
          fi
          docker compose --env-file env/.env.deploy -f compose/compose.production.yml up -d --wait --wait-timeout 120 postgres redis minio
          docker compose --env-file env/.env.deploy -f compose/compose.production.yml up --force-recreate --exit-code-from minio-init minio-init
          docker compose --env-file env/.env.deploy -f compose/compose.production.yml run --rm -T db-migrator </dev/null
          docker compose --env-file env/.env.deploy -f compose/compose.production.yml run --rm -T db-baseline-preflight </dev/null
          docker compose --env-file env/.env.deploy -f compose/compose.production.yml run --rm -T db-seeder </dev/null
          deploy_phase=service_start
          docker compose --env-file env/.env.deploy -f compose/compose.production.yml up -d --wait --wait-timeout 180
          database_writers_quiesced=false
          docker compose --env-file env/.env.deploy -f compose/compose.production.yml exec -T \
            -e CHART_SMOKE_ALLOW_PRODUCTION=true \
            -e CHART_SMOKE_EXPECTED_DATABASE_HOST=postgres \
            -e CHART_SMOKE_EXPECTED_DATABASE_NAME=elevenhouse \
            -e CHART_SMOKE_API_BASE_URL=http://127.0.0.1:3002 \
            -e CHART_WORKER_BASE_URL=http://chart-worker:3012 \
            -e CHART_ENGINE_BASE_URL=http://chart-engine:8012 \
            -e CHART_SMOKE_ORIGIN=https://app.elevenhouse.ai \
            -e CHART_SMOKE_POLL_TIMEOUT_MS=150000 \
            -e CHART_SMOKE_CLEANUP_SETTLE_TIMEOUT_MS=150000 \
            astrologer-api node apps/astrologer-api/scripts/chart-engine-smoke.mjs
          docker compose --env-file env/.env.deploy -f compose/compose.production.yml ps
          trap - ERR
          REMOTE

      - name: Smoke check
        run: |
          curl --retry 12 --retry-all-errors --retry-delay 10 --retry-max-time 120 --connect-timeout 10 --max-time 20 -fsS https://elevenhouse.ai >/dev/null
          curl --retry 12 --retry-all-errors --retry-delay 10 --retry-max-time 120 --connect-timeout 10 --max-time 20 -fsS https://client.elevenhouse.ai >/dev/null
          curl --retry 12 --retry-all-errors --retry-delay 10 --retry-max-time 120 --connect-timeout 10 --max-time 20 -fsS https://client.elevenhouse.ai/api/health
          curl --retry 12 --retry-all-errors --retry-delay 10 --retry-max-time 120 --connect-timeout 10 --max-time 20 -fsS https://app.elevenhouse.ai >/dev/null
          curl --retry 12 --retry-all-errors --retry-delay 10 --retry-max-time 120 --connect-timeout 10 --max-time 20 -fsS https://app.elevenhouse.ai/api/health
          curl --retry 12 --retry-all-errors --retry-delay 10 --retry-max-time 120 --connect-timeout 10 --max-time 20 -fsS https://admin.elevenhouse.ai >/dev/null
          curl --retry 12 --retry-all-errors --retry-delay 10 --retry-max-time 120 --connect-timeout 10 --max-time 20 -fsS https://admin.elevenhouse.ai/api/health

      - name: Cleanup production Docker artifacts
        if: success()
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i ~/.ssh/elevenhouse)
          ssh "${SSH_OPTS[@]}" "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            RELEASE_ID="${IMAGE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/elevenhouse
          ./cleanup-docker-retention.sh record-successful-release "${RELEASE_ID}"
          ./cleanup-docker-retention.sh cleanup-current-only
          REMOTE

  cleanup-runner:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - elevenhouse-stage
    needs:
      - deploy
    if: ${{ needs.deploy.result == 'success' }}
    permissions:
      contents: read
    steps:
      - name: Validate runner identity
        run: |
          if [ "$(id -u)" = "0" ]; then
            echo "SELF_HOSTED_RUNNER_MUST_NOT_RUN_AS_ROOT" >&2
            exit 1
          fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            echo "SELF_HOSTED_RUNNER_MUST_NOT_HAVE_PASSWORDLESS_SUDO" >&2
            exit 1
          fi
          case "${GITHUB_WORKSPACE:-}" in
            /opt/* | /root/* | /)
              echo "SELF_HOSTED_RUNNER_WORKSPACE_FORBIDDEN path=${GITHUB_WORKSPACE:-}" >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Validate rootless Docker
        run: bash deployment/scripts/validate-self-hosted-runner.sh --require-rootless-docker

      - name: Cleanup runner Docker artifacts
        run: |
          docker container prune -f
          docker builder prune -af
          docker image prune -af
